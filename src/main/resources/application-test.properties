# Test credentials use a dedicated namespace and never fall back to the
# application or local database configuration.
spring.datasource.url=${PAYVERSE_TEST_DB_URL}
spring.datasource.username=${PAYVERSE_TEST_DB_USERNAME}
spring.datasource.password=${PAYVERSE_TEST_DB_PASSWORD}

spring.liquibase.enabled=${PAYVERSE_TEST_LIQUIBASE_ENABLED:true}

spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
