spring.application.name=payment-api

# PostgreSQL
spring.datasource.url=${PAYVERSE_DB_URL}
spring.datasource.username=${PAYVERSE_DB_USERNAME}
spring.datasource.password=${PAYVERSE_DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# Liquibase
spring.liquibase.enabled=true
spring.liquibase.change-log=classpath:db/changelog/db.changelog-master.xml

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=${PAYVERSE_JPA_SHOW_SQL:false}
spring.jpa.properties.hibernate.format_sql=${PAYVERSE_JPA_FORMAT_SQL:false}

# Cybersource HTTP Signature
cybersource.merchant-id=${CYBERSOURCE_MERCHANT_ID}
cybersource.merchant-key-id=${CYBERSOURCE_MERCHANT_KEY_ID}
cybersource.merchant-secret-key=${CYBERSOURCE_MERCHANT_SECRET_KEY}
cybersource.run-environment=${CYBERSOURCE_RUN_ENVIRONMENT:apitest.cybersource.com}

# Origin of the checkout page that hosts the 3DS challenge iframe (postMessage target). Change per environment.
threeds.frontend-origin=${THREEDS_FRONTEND_ORIGIN:http://localhost:63342}

# Browser origins allowed to call the API (comma-separated). Defaults to the 3DS frontend origin.
cors.allowed-origins=${CORS_ALLOWED_ORIGINS:${threeds.frontend-origin}}
