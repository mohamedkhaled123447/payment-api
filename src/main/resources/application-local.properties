# Local development uses only a local PostgreSQL endpoint by default. Supply a
# unique local password through .env or the process environment.
spring.datasource.url=${PAYVERSE_DB_URL:jdbc:postgresql://localhost:5432/payverse}
spring.datasource.username=${PAYVERSE_DB_USERNAME:payverse_local}
spring.datasource.password=${PAYVERSE_DB_PASSWORD}

spring.liquibase.enabled=${PAYVERSE_LIQUIBASE_ENABLED:true}

# SQL output remains opt-in because statements can contain sensitive data.
spring.jpa.show-sql=${PAYVERSE_JPA_SHOW_SQL:false}
spring.jpa.properties.hibernate.format_sql=${PAYVERSE_JPA_FORMAT_SQL:false}
